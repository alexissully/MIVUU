const YEARS = [2025, 2030, 2035, 2045, 2055];

function colorFor(d){
  if(d.score < 50 || d.stability < 45) return "red";
  if(d.stability >= 84 && d.gdpGrowth >= 0) return "green";
  return "gold";
}

// Construit une projection PIB indexée (base 100 en 2025) sur 30 ans
function buildProjection(d){
  const pts=[]; let v=100;
  for(let y=2025; y<=2055; y++){
    const t=y-2025;
    // léger amortissement de la croissance dans le temps + bruit déterministe
    const decay = 1 - Math.min(0.45, t*0.012);
    const noise = Math.sin((t+ d.id.charCodeAt(0)) * 0.9) * (Math.abs(d.gdpGrowth)*0.12);
    const g = (d.gdpGrowth*decay + noise)/100;
    v = v * (1 + g);
    pts.push({year:y, value:Math.max(40, v)});
  }
  return pts;
}

const DATA = RAW.map(d=>{
  const proj = buildProjection(d);
  const final = proj[proj.length-1].value;
  return {...d, color:colorFor(d), proj, proj30: Math.round(final-100)};
});

// Score projeté pour une année donnée (interpolation simple basée sur la croissance)
function scoreAtYear(d, year){
  const t = year-2025;
  // marchés émergents montent, marchés à risque divergent
  const trendBoost = d.cat==="emerging" ? (d.gdpGrowth-3)*0.55 : (d.gdpGrowth-2.5)*0.18;
  const riskDrag = d.stability<45 ? -(t*0.25) : 0;
  let s = d.score + (t/30)*(trendBoost*30) + riskDrag;
  return Math.max(0, Math.min(100, Math.round(s)));
}

function CircularScore({value, color}){
  const r=46, c=2*Math.PI*r;
  const [disp,setDisp]=useState(0);
  useEffect(()=>{
    let raf, start;
    const dur=900;
    const step=(ts)=>{ if(!start) start=ts; const p=Math.min(1,(ts-start)/dur);
      setDisp(Math.round(value*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[value]);
  const off = c*(1-disp/100);
  return (
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="9"/>
      <circle cx="60" cy="60" r={r} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 60 60)"
        style={{filter:`drop-shadow(0 0 6px ${color})`, transition:"stroke-dashoffset .1s linear"}}/>
      <text x="60" y="58" textAnchor="middle" fontFamily="var(--mono)" fontSize="30" fontWeight="700" fill={color}>{disp}</text>
      <text x="60" y="78" textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fill="#6b8299">/ 100</text>
    </svg>
  );
}

function LineChart({proj, color}){
  const W=300,H=110,pad=8;
  const vals=proj.map(p=>p.value);
  const min=Math.min(...vals), max=Math.max(...vals);
  const x=i=> pad + i*(W-2*pad)/(proj.length-1);
  const y=v=> H-pad - (v-min)/((max-min)||1)*(H-2*pad);
  const pts=proj.map((p,i)=>`${x(i)},${y(p.value)}`).join(" ");
  const area=`${pad},${H-pad} ${pts} ${W-pad},${H-pad}`;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0,0.5,1].map((g,i)=><line key={i} x1={pad} x2={W-pad} y1={pad+g*(H-2*pad)} y2={pad+g*(H-2*pad)} stroke="rgba(255,255,255,0.06)"/>)}
      <polygon points={area} fill="url(#lg)"/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" style={{filter:`drop-shadow(0 0 4px ${color})`}}/>
      {proj.filter((_,i)=>i%5===0).map((p,i)=>(
        <g key={i}>
          <circle cx={x(proj.indexOf(p))} cy={y(p.value)} r="2.5" fill={color}/>
          <text x={x(proj.indexOf(p))} y={H-1} fontSize="8" textAnchor="middle" fill="#6b8299" fontFamily="var(--mono)">{p.year}</text>
        </g>
      ))}
    </svg>
  );
}

/* =========================================================
   RADAR CENTRAL (SVG animé)
   ========================================================= */
function RadarMap({year, selected, hovered, onHover, onSelect}){
  const VB=560, cx=VB/2, cy=VB/2;
  const ringR=[60,110,165,220,255];
  const nodes=useMemo(()=>{
    // regroupe par horizon -> anneau ; angle réparti dans le groupe
    const byRing={};
    YEARS.forEach((y,i)=>byRing[y]=[]);
    DATA.forEach(d=>byRing[d.horizon].push(d));
    const out=[];
    YEARS.forEach((y,ri)=>{
      const grp=byRing[y]; const n=grp.length;
      grp.forEach((d,gi)=>{
        const ang = (gi/n)*Math.PI*2 + ri*0.6 - Math.PI/2;
        const r=ringR[ri];
        out.push({...d, x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r, ring:ri});
      });
    });
    return out;
  },[]);
  const activeRing = YEARS.reduce((acc,y,i)=> year>=y?i:acc, 0);

  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${VB} ${VB}`} style={{maxHeight:"100%"}}>
      <defs>
        <radialGradient id="core" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#00F5FF" stopOpacity="0.25"/>
          <stop offset="100%" stopColor="#00F5FF" stopOpacity="0"/>
        </radialGradient>
        <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#00F5FF" stopOpacity="0"/>
          <stop offset="100%" stopColor="#00F5FF" stopOpacity="0.35"/>
        </linearGradient>
      </defs>

      {/* halo central */}
      <circle cx={cx} cy={cy} r="90" fill="url(#core)"/>

      {/* anneaux temporels */}
      {ringR.map((r,i)=>(
        <g key={i}>
          <circle cx={cx} cy={cy} r={r} fill="none"
            stroke={i===activeRing?COLORS.cyan:"rgba(0,245,255,0.18)"}
            strokeWidth={i===activeRing?1.6:1}
            strokeDasharray={i===activeRing?"none":"3 6"}
            style={i===activeRing?{filter:"drop-shadow(0 0 4px #00F5FF)"}:{}}/>
          <text x={cx} y={cy-r-3} textAnchor="middle" className="mono"
            fontSize="11" fill={i===activeRing?COLORS.cyan:"#6b8299"} fontWeight="700">{YEARS[i]}</text>
        </g>
      ))}

      {/* lignes radiales */}
      {[0,1,2,3,4,5,6,7].map(i=>{
        const a=i/8*Math.PI*2; return <line key={i} x1={cx} y1={cy}
          x2={cx+Math.cos(a)*ringR[4]} y2={cy+Math.sin(a)*ringR[4]}
          stroke="rgba(0,245,255,0.08)" strokeWidth="1"/>;
      })}

      {/* balayage radar */}
      <g style={{transformOrigin:`${cx}px ${cy}px`, animation:"sweep 8s linear infinite"}}>
        <polygon points={`${cx},${cy} ${cx+ringR[4]},${cy-30} ${cx+ringR[4]},${cy+30}`} fill="url(#sweepGrad)"/>
        <line x1={cx} y1={cy} x2={cx+ringR[4]} y2={cy} stroke={COLORS.cyan} strokeWidth="1.5" opacity="0.5"/>
      </g>

      {/* nœuds */}
      {nodes.map(d=>{
        const col=COLORS[d.color];
        const isSel=selected===d.id, isHov=hovered===d.id;
        const sz = isSel?9 : isHov?8 : 5.5;
        return (
          <g key={d.id} style={{cursor:"pointer"}}
             onMouseEnter={()=>onHover(d.id)} onMouseLeave={()=>onHover(null)}
             onClick={()=>onSelect(d.id)}>
            <circle cx={d.x} cy={d.y} r="11" fill={col} opacity="0.5"
              style={{transformOrigin:`${d.x}px ${d.y}px`, animation:`pulse ${2+ (d.score%5)*0.3}s ease-in-out infinite`}}/>
            <circle cx={d.x} cy={d.y} r={sz} fill={col}
              stroke={isSel?"#fff":col} strokeWidth={isSel?2:0}
              style={{filter:`drop-shadow(0 0 ${isSel?10:5}px ${col})`, transition:"r .15s"}}/>
            {(isHov||isSel) && (
              <text x={d.x} y={d.y-14} textAnchor="middle" className="mono" fontSize="10"
                fill="#fff" fontWeight="700" style={{pointerEvents:"none"}}>{d.flag} {d.name}</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* =========================================================
   RADAR DE COMPARAISON (hexagone 6 métriques)
   ========================================================= */
function CompareRadar({items}){
  const W=240,cx=120,cy=120,R=88;
  const axes=["Croiss.","Stabilité","Infra","Innov.","Immo.","Démo."];
  const norm=(d)=>metricList(d).map(m=>m.norm/100);
  const palette=[COLORS.cyan, COLORS.gold, COLORS.green];
  const pt=(i,r)=>{ const a=i/6*Math.PI*2 - Math.PI/2;
    return [cx+Math.cos(a)*R*r, cy+Math.sin(a)*R*r]; };
  return (
    <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
      {[0.25,0.5,0.75,1].map((g,i)=>(
        <polygon key={i} points={axes.map((_,j)=>pt(j,g).join(",")).join(" ")}
          fill="none" stroke="rgba(0,245,255,0.12)"/>
      ))}
      {axes.map((a,i)=>{
        const [ex,ey]=pt(i,1.0); const [lx,ly]=pt(i,1.18);
        return <g key={i}>
          <line x1={cx} y1={cy} x2={ex} y2={ey} stroke="rgba(0,245,255,0.12)"/>
          <text x={lx} y={ly} textAnchor="middle" fontSize="9" fill="#6b8299" className="mono">{a}</text>
        </g>;
      })}
      {items.map((d,k)=>{
        const v=norm(d); const col=palette[k];
        const poly=v.map((val,i)=>pt(i,val).join(",")).join(" ");
        return <polygon key={d.id} points={poly} fill={`${col}22`} stroke={col} strokeWidth="2"
          style={{filter:`drop-shadow(0 0 4px ${col})`}}/>;
      })}
    </svg>
  );
}

            </div>
          )}
        </div>
      </div>
    </div>
  );
}
