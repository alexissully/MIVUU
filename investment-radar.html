  input[type=range]{accent-color:var(--cyan);width:100%;}

  @keyframes pulse{0%{transform:scale(1);opacity:.9;}50%{transform:scale(1.8);opacity:.1;}100%{transform:scale(1);opacity:.9;}}
  @keyframes sweep{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes blink{50%{opacity:.35;}}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @keyframes floatTilt{0%,100%{transform:rotateX(52deg) scale(1.08) translateY(0);}50%{transform:rotateX(50deg) scale(1.09) translateY(-6px);}}
  .blink{animation:blink 1.4s steps(2) infinite;}

  #app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:10px;gap:10px;}
  .cols{flex:1;display:flex;gap:10px;min-height:0;}
  .left{width:330px;display:flex;flex-direction:column;padding:12px;min-height:0;}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;padding:8px;perspective:1100px;overflow:hidden;}
  #radarWrap{display:flex;align-items:center;justify-content:center;flex:1;position:relative;transform-style:preserve-3d;}
  #radarTilt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform:rotateX(52deg) scale(1.08);transform-origin:center 60%;transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:floatTilt 7s ease-in-out infinite;}
  .center.flat #radarTilt{transform:rotateX(0deg) scale(1);animation:none;}
  .right{width:360px;display:flex;flex-direction:column;padding:14px;overflow-y:auto;min-height:0;}
  .bottom{padding:12px;display:flex;gap:18px;align-items:center;min-height:170px;}
  .row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:3px;}
  .chip{font-size:10px;padding:4px 8px;border-radius:7px;letter-spacing:.5px;border:1px solid rgba(0,245,255,.2);color:#9fb4c7;}
  .chip.active{border-color:var(--cyan);background:rgba(0,245,255,.15);color:var(--cyan);}
  .sort{font-size:10px;padding:3px 6px;border-radius:6px;color:#6b8299;}
  .sort.active{color:var(--gold);text-decoration:underline;font-weight:700;}

</style>

function colorFor(d){
  if(d.score<50||d.stability<45) return "red";
  if(d.stability>=84&&d.gdpGrowth>=0) return "green";
  return "gold";
}
function buildProjection(d){
  var pts=[],v=100;
  for(var y=2025;y<=2055;y++){
    var t=y-2025;
    var decay=1-Math.min(0.45,t*0.012);
    var noise=Math.sin((t+d.id.charCodeAt(0))*0.9)*(Math.abs(d.gdpGrowth)*0.12);
    var g=(d.gdpGrowth*decay+noise)/100;
    v=v*(1+g);
    pts.push({year:y,value:Math.max(40,v)});
  }
  return pts;
}
var DATA=RAW.map(function(d){
  var proj=buildProjection(d), final=proj[proj.length-1].value;
  d.color=colorFor(d); d.proj=proj; d.proj30=Math.round(final-100);
  return d;
});
function byId(id){return DATA.filter(function(d){return d.id===id;})[0];}
function scoreAtYear(d,year){
  var t=year-2025;
  var trendBoost=d.cat==="emerging"?(d.gdpGrowth-3)*0.55:(d.gdpGrowth-2.5)*0.18;
  var riskDrag=d.stability<45?-(t*0.25):0;
  var s=d.score+(t/30)*(trendBoost*30)+riskDrag;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function metricList(d){
  return [
    {label:"Croissance PIB",val:d.gdpGrowth,norm:Math.min(100,(d.gdpGrowth+3)/11*100),unit:"%"},
    {label:"Stabilité politique",val:d.stability,norm:d.stability,unit:"/100"},

    {label:"Indice d'innovation",val:d.innov,norm:d.innov,unit:"/100"},
    {label:"Rendement immobilier",val:d.reYield,norm:Math.min(100,d.reYield/10*100),unit:"%"},
    {label:"Croissance démog.",val:d.popGrowth,norm:Math.min(100,(d.popGrowth+1)/4*100),unit:"%"}
  ];
}

  {key:"E",label:"Économique",icon:"📈"},
  {key:"S",label:"Social",icon:"👥"},
  {key:"T",label:"Technologique",icon:"⚙"},

  {key:"L",label:"Légal",icon:"§"}
];
function clamp100(v){return Math.max(0,Math.min(100,Math.round(v)));}
function normRange(v,min,max){return Math.max(0,Math.min(100,(v-min)/(max-min)*100));}
function pestelScores(d){
  var envBase=d.infra*0.45+d.innov*0.2+30;
  var s=d.sectors.join(",");
  if(/Énergie|Auto|Manufacture|Matières/.test(s)) envBase-=12;
  if(/Tech|Fintech|E-gov|Biotech|SaaS|Numérique/.test(s)) envBase+=8;
  return {
    P:clamp100(d.stability),
    E:clamp100(normRange(d.gdpGrowth,-3,8)*0.55+d.score*0.45),
    S:clamp100(normRange(d.popGrowth,-1,3)*0.45+d.innov*0.55),
    T:clamp100(d.innov),
    N:clamp100(envBase),
    L:clamp100(d.stability*0.6+d.infra*0.4)
  };
}
function pestelGlobal(d){
  var p=pestelScores(d);
  return Math.round((p.P+p.E+p.S+p.T+p.N+p.L)/6);
}
/* "Fait du prince" : pays économiquement solides ET politiquement stables */
function isPrincePick(d){
  var p=pestelScores(d);
  return p.E>=68 && p.P>=80 && d.risk!=="HIGH";
}
function pestelVerdict(d){
  var g=pestelGlobal(d);
  if(g>=80) return {t:"PROFIL D'EXCELLENCE",c:COLORS.green};
  if(g>=65) return {t:"PROFIL SOLIDE",c:COLORS.gold};
  if(g>=50) return {t:"PROFIL CONTRASTÉ",c:COLORS.gold};
  return {t:"PROFIL FRAGILE",c:COLORS.red};
}

  if(s2-s>2) return {a:"↑",c:COLORS.green};
  if(s2-s<-2) return {a:"↓",c:COLORS.red};
  return {a:"→",c:"#6b8299"};
}
function globalState(){

  if(y<2045) return {t:"CROISSANCE",c:COLORS.green};
  return {t:"VOLATIL",c:COLORS.gold};
}

  if(state.prince) list=list.filter(isPrincePick);
  var cmp={
    score:function(a,b){return b.liveScore-a.liveScore;},
    gdp:function(a,b){return b.gdpGrowth-a.gdpGrowth;},
    stability:function(a,b){return b.stability-a.stability;},
    proj:function(a,b){return b.proj30-a.proj30;},
    pestel:function(a,b){return pestelGlobal(b)-pestelGlobal(a);},
    prince:function(a,b){return (b.stability+ b.gdpGrowth*4)-(a.stability+ a.gdpGrowth*4);}
  }[state.sort]||function(a,b){return b.liveScore-a.liveScore;};
  return list.sort(cmp).slice(0,20);
}

/* ===================== RADAR ===================== */
var RING_R=[60,110,165,220,255];
var RADAR_NODES=[];
function computeNodes(){
  var cx=280,cy=280,byRing={};
  YEARS.forEach(function(y){byRing[y]=[];});
  DATA.forEach(function(d){byRing[d.horizon].push(d);});
  RADAR_NODES=[];
  YEARS.forEach(function(y,ri){
    var grp=byRing[y],n=grp.length;
    grp.forEach(function(d,gi){
      var ang=(gi/n)*Math.PI*2+ri*0.6-Math.PI/2, r=RING_R[ri];
      RADAR_NODES.push({d:d,x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r,ring:ri});
    });
  });
}

  computeNodes();

    '<radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="'+COLORS.cyan+'" stop-opacity="0.35"/><stop offset="50%" stop-color="'+COLORS.cyan+'" stop-opacity="0.15"/><stop offset="100%" stop-color="'+COLORS.cyan+'" stop-opacity="0"/></radialGradient>'+

    '</defs>';
  var halo='<circle cx="'+cx+'" cy="'+cy+'" r="120" fill="url(#core)" opacity="0.8"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="70" fill="url(#goldcore)" style="transform-origin:'+cx+'px '+cy+'px;animation:pulse 3.5s ease-in-out infinite;"/>'+

  for(var i=0;i<8;i++){var a=i/8*Math.PI*2;radial+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*RING_R[4])+'" y2="'+(cy+Math.sin(a)*RING_R[4])+'" stroke="'+COLORS.cyan+'" stroke-width="0.5" opacity="0.12" style="filter:drop-shadow(0 0 2px '+COLORS.cyan+')"/>';}
  var sweep='<g id="sweep" style="transform-origin:'+cx+'px '+cy+'px;animation:sweep 8s linear infinite;">'+
    '<polygon points="'+cx+','+cy+' '+(cx+RING_R[4])+','+(cy-30)+' '+(cx+RING_R[4])+','+(cy+30)+'" fill="url(#sweepGrad)"/>'+

function lineChart(proj,color){
  var W=300,H=110,pad=8;
  var vals=proj.map(function(p){return p.value;});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  function x(i){return pad+i*(W-2*pad)/(proj.length-1);}
  function y(v){return H-pad-(v-min)/((max-min)||1)*(H-2*pad);}
  var pts=proj.map(function(p,i){return x(i)+','+y(p.value);}).join(" ");
  var area=pad+','+(H-pad)+' '+pts+' '+(W-pad)+','+(H-pad);
  var grid=[0,0.5,1].map(function(g){return '<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+(pad+g*(H-2*pad))+'" y2="'+(pad+g*(H-2*pad))+'" stroke="rgba(255,255,255,0.06)"/>';}).join('');
  var marks='';
  proj.forEach(function(p,i){if(i%5===0){marks+='<circle cx="'+x(i)+'" cy="'+y(p.value)+'" r="2.5" fill="'+color+'"/><text x="'+x(i)+'" y="'+(H-1)+'" font-size="8" text-anchor="middle" fill="#6b8299" class="mono">'+p.year+'</text>';}});
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;">'+
    '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.35"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<polygon points="'+area+'" fill="url(#lg)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" style="filter:drop-shadow(0 0 4px '+color+');"/>'+marks+'</svg>';
}

    '</div>'+

      '<svg width="120" height="120" viewBox="0 0 120 120">'+

        '<circle id="scoreArc" cx="60" cy="60" r="46" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px '+col+');transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);"/>'+
        '<text id="scoreNum" x="60" y="58" text-anchor="middle" class="mono" font-size="30" font-weight="700" fill="'+col+'">0</text>'+

      '</svg>'+

    '<div style="display:flex;flex-wrap:wrap;gap:6px;">'+secs+'</div>'+
    '<button data-comp-toggle="'+d.id+'" class="mono" style="margin-top:16px;padding:9px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:.5px;width:100%;border:1px solid '+(inComp?COLORS.gold:COLORS.cyan)+';background:'+(inComp?COLORS.gold+"18":COLORS.cyan+"12")+';color:'+(inComp?COLORS.gold:COLORS.cyan)+';">'+(inComp?"✓ DANS LE COMPARATIF":"+ AJOUTER AU COMPARATIF")+'</button>';

  // animations post-rendu
  var arc=document.getElementById("scoreArc"),num=document.getElementById("scoreNum");

    arc.setAttribute("stroke-dashoffset",c*(1-d.score/100));

  function step(ts){if(!start)start=ts;var p=Math.min(1,(ts-start)/dur);num.textContent=Math.round(d.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function compareRadar(items){
  var W=240,cx=120,cy=120,R=88;
  var axes=["Croiss.","Stabilité","Infra","Innov.","Immo.","Démo."];
  function pt(i,r){var a=i/6*Math.PI*2-Math.PI/2;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r];}
  var grid=[0.25,0.5,0.75,1].map(function(g){return '<polygon points="'+axes.map(function(_,j){return pt(j,g).join(",");}).join(" ")+'" fill="none" stroke="rgba(0,245,255,0.12)"/>';}).join('');
  var ax=axes.map(function(a,i){var e=pt(i,1),l=pt(i,1.18);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="rgba(0,245,255,0.12)"/><text x="'+l[0]+'" y="'+l[1]+'" text-anchor="middle" font-size="9" fill="#6b8299" class="mono">'+a+'</text>';}).join('');
  var polys=items.map(function(d,k){var col=COMP_PAL[k];var v=metricList(d).map(function(m){return m.norm/100;});var poly=v.map(function(val,i){return pt(i,val).join(",");}).join(" ");return '<polygon points="'+poly+'" fill="'+col+'22" stroke="'+col+'" stroke-width="2" style="filter:drop-shadow(0 0 4px '+col+');"/>';}).join('');
  return '<svg width="'+W+'" height="'+W+'" viewBox="0 0 '+W+' '+W+'">'+grid+ax+polys+'</svg>';
}
function renderBottom(){
  var items=state.compare.map(byId).filter(Boolean);
  var best=items.length?items.slice().sort(function(a,b){return b.proj30-a.proj30;})[0]:null;
  var legend=items.length?items.map(function(d,k){return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;"><span style="width:9px;height:9px;border-radius:2px;background:'+COMP_PAL[k]+';"></span><span>'+d.flag+' '+d.name+'</span><button data-comp-remove="'+d.id+'" style="margin-left:auto;color:'+COLORS.red+';font-size:13px;">✕</button></div>';}).join(''):'<span style="font-size:11px;color:#6b8299;">Ajoutez des destinations depuis le panneau de détail.</span>';
  var radar=items.length?compareRadar(items):'<div class="mono" style="font-size:11px;color:#33485c;width:240px;text-align:center;">— radar comparatif —</div>';
  var cards=items.map(function(d,k){return '<div style="flex:1 1 140px;min-width:140px;padding:8px 10px;border-radius:9px;border:1px solid '+COMP_PAL[k]+'40;background:'+COMP_PAL[k]+'0d;"><div style="font-size:12px;font-weight:700;margin-bottom:4px;">'+d.flag+' '+d.name+'</div><div class="mono" style="font-size:10.5px;color:#9fb4c7;line-height:1.7;">Score <span style="color:'+COLORS[d.color]+';">'+d.score+'</span> · PIB '+d.gdpGrowth+'%<br>Stab. '+d.stability+' · Proj.30A <span style="color:'+COLORS.gold+';">+'+d.proj30+'%</span></div></div>';}).join('');
  var reco=best?'<div class="mono" style="font-size:12.5px;color:#cfe0ee;padding:8px 12px;border-radius:9px;border:1px solid '+COLORS.green+'40;background:'+COLORS.green+'10;">🏆 Meilleur pour le patrimoine long terme : <span style="color:'+COLORS.green+';font-weight:700;">'+best.flag+' '+best.name+'</span> — projection PIB 30 ans la plus élevée (<span style="color:'+COLORS.gold+';">+'+best.proj30+'%</span>), risque <b>'+RISK_FR[best.risk]+'</b>.</div>':'';

  document.getElementById("bottomPanel").innerHTML=
    '<div style="display:flex;flex-direction:column;gap:6px;min-width:150px;">'+
      '<div style="font-size:13px;font-weight:700;color:'+COLORS.cyan+';letter-spacing:1px;">⚖ COMPARATIF</div>'+
      '<div class="mono" style="font-size:10px;color:#6b8299;">jusqu\'à 3 destinations</div>'+
      '<div style="display:flex;flex-direction:column;gap:5px;margin-top:4px;">'+legend+'</div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;justify-content:center;">'+radar+'</div>'+
    '<div style="flex:1;display:flex;flex-direction:column;gap:10px;">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+cards+'</div>'+reco+
    '</div>';
}

  var d=byId(id),tt=document.getElementById("tooltip");
  tt.className="glass";
  tt.style.cssText="position:absolute;bottom:14px;left:14px;z-index:3;max-width:240px;padding:10px 14px;box-shadow:0 0 14px rgba(0,245,255,0.45);";

    '<div class="mono" style="font-size:11px;color:#9fb4c7;line-height:1.6;">Score <span style="color:'+COLORS[d.color]+';">'+scoreAtYear(d,state.year)+'</span> · PIB <span style="color:'+COLORS.green+';">'+d.gdpGrowth+'%</span><br>Stabilité '+d.stability+' · Proj. 30A <span style="color:'+COLORS.gold+';">+'+d.proj30+'%</span></div>';
  tt.style.display="block";
}
function hideTooltip(){var tt=document.getElementById("tooltip");tt.style.display="none";}

/* ===================== RENDER + ÉVÉNEMENTS ===================== */
function render(){
  updateTopbar(); renderLeft(); renderRight(); renderBottom(); renderRings(); renderNodes();
}
function bindEvents(){
  document.getElementById("app").addEventListener("click",function(e){
    var t=e.target.closest("[data-select],[data-node],[data-filter],[data-sort],[data-comp-toggle],[data-comp-remove],[data-pestel-toggle],[data-prince-toggle],[data-flat-toggle]");
    if(!t) return;
    if(t.hasAttribute("data-pestel-toggle")){state.pestel=!state.pestel;render();return;}
    if(t.hasAttribute("data-prince-toggle")){state.prince=!state.prince;if(state.prince)state.sort="prince";render();return;}
    if(t.hasAttribute("data-flat-toggle")){document.querySelector(".center").classList.toggle("flat");return;}
    if(t.hasAttribute("data-filter")){state.filter=t.getAttribute("data-filter");render();return;}
    if(t.hasAttribute("data-sort")){state.sort=t.getAttribute("data-sort");render();return;}
    if(t.hasAttribute("data-comp-toggle")){toggleCompare(t.getAttribute("data-comp-toggle"));render();return;}
    if(t.hasAttribute("data-comp-remove")){toggleCompare(t.getAttribute("data-comp-remove"));render();return;}
    var id=t.getAttribute("data-select")||t.getAttribute("data-node");
    if(id){state.selected=id;render();
      var rp=document.getElementById("rightPanel"); if(window.innerWidth<=900&&rp) rp.scrollIntoView({behavior:"smooth",block:"start"});}
  });
  // survol radar (desktop)
  var radar=document.getElementById("radar");
  radar.addEventListener("mouseover",function(e){var g=e.target.closest("[data-node]");if(g){state.hovered=g.getAttribute("data-node");showTooltip(state.hovered);renderNodes();}});
  radar.addEventListener("mouseout",function(e){var g=e.target.closest("[data-node]");if(g){state.hovered=null;hideTooltip();renderNodes();}});
}
function toggleCompare(id){
  var i=state.compare.indexOf(id);
  if(i>=0) state.compare.splice(i,1);
  else if(state.compare.length<3) state.compare.push(id);
}

/* ===================== EFFET "MAIN DU PRINCE" (traînée dorée) ===================== */
function initPrinceTouch(){
  var canvas=document.createElement("canvas");
  canvas.id="sparkleCanvas";
  document.body.appendChild(canvas);
  var ctx=canvas.getContext("2d"),particles=[];
  if(!ctx) return;
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();
  window.addEventListener("resize",resize);
  function spawn(x,y){
    for(var i=0;i<3;i++){
      particles.push({
        x:x+(Math.random()-0.5)*6, y:y+(Math.random()-0.5)*6,
        vx:(Math.random()-0.5)*0.6, vy:-Math.random()*0.9-0.2,
        life:1, decay:0.018+Math.random()*0.015, size:Math.random()*3+1.5,
        col:Math.random()<0.5?"#FFD700":"#FFF3B0"
      });
    }
  }
  function onMove(e){
    var x,y;
    if(e.touches&&e.touches.length){x=e.touches[0].clientX;y=e.touches[0].clientY;}
    else{x=e.clientX;y=e.clientY;}
    spawn(x,y);
  }
  window.addEventListener("mousemove",onMove);
  window.addEventListener("touchmove",onMove,{passive:true});
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    particles=particles.filter(function(p){return p.life>0;});
    requestAnimationFrame(tick);
  }
  tick();
}
